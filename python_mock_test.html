<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Mock Test - 40 Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#f4f7fc;padding:20px;}
.container{max-width:1000px;margin:auto;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.back-btn{padding:10px 16px;border-radius:12px;background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);color:#3b82f6;font-weight:500;cursor:pointer;transition:all 0.2s ease;}
.back-btn:hover{background:rgba(59,130,246,0.25);}
h1{text-align:center;margin-bottom:20px;color:#1e3a8a;}
.question-card{background:#fff;margin-bottom:20px;padding:20px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.1);border-top:5px solid #2563eb;}
.question{font-weight:bold;margin-bottom:15px;color:#1e3a8a;}
.option{display:block;margin:8px 0;padding:12px;border:2px solid #ddd;border-radius:10px;cursor:pointer;transition:.3s;}
.option:hover{background:#eef4ff;}
.correct{background:#22c55e !important;color:#fff;border-color:#22c55e !important;}
.wrong{background:#ef4444 !important;color:#fff;border-color:#ef4444 !important;}
#scoreBox{position:sticky;top:10px;background:#1e3a8a;color:white;padding:15px;text-align:center;border-radius:12px;margin-bottom:20px;font-weight:600;}
.submit-btn{display:block;margin:20px auto;padding:12px 30px;background:linear-gradient(135deg, #3b82f6, #2563eb);color:white;border:none;border-radius:12px;font-weight:600;cursor:pointer;transition:all 0.2s ease;font-size:1rem;}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(59,130,246,0.3);}
</style>
</head>
<body>
<div class="container">
<div class="header">
    <button class="back-btn" onclick="window.location.href='mock_tests.html'">← Back</button>
    <h1>Python Mock Test (40 Questions)</h1>
    <div style="width:100px;"></div>
</div>
<div id="scoreBox">
Score: <span id="score">0</span> / 40
</div>
<div id="quiz"></div>
<button class="submit-btn" onclick="submitTest()">Submit Test</button>
</div>

<script>
const questions = [
{q:"Which of the following is a mutable data type in Python?",o:["tuple","str","list","frozenset"],a:2},
{q:"What is the output of len('Python')?",o:["5","6","7","Error"],a:1},
{q:"Which keyword is used to define a function?",o:["func","function","define","def"],a:3},
{q:"Which data structure stores key-value pairs?",o:["List","Tuple","Dictionary","Set"],a:2},
{q:"What is the output of 10//3?",o:["3.33","3","4","1"],a:1},
{q:"Which operator is used for exponentiation?",o:["^","**","//","%%"],a:1},
{q:"Which of the following is immutable?",o:["List","Dictionary","Set","Tuple"],a:3},
{q:"What does PEP stand for?",o:["Python Enhancement Proposal","Programming Enhancement Protocol","Python Execution Plan","Programming Execution Proposal"],a:0},
{q:"Which function converts string to integer?",o:["str()","float()","int()","chr()"],a:2},
{q:"What is the output of bool([])?",o:["True","False","None","Error"],a:1},
{q:"Which keyword is used for exception handling?",o:["catch","try","except","error"],a:2},
{q:"What is the output of type({})?",o:["set","list","dict","tuple"],a:2},
{q:"Which symbol starts a comment?",o:["//","#","/*","--"],a:1},
{q:"Which method adds an item to a list?",o:["insert()","append()","add()","push()"],a:1},
{q:"Which method removes and returns last item?",o:["delete()","pop()","remove()","discard()"],a:1},
{q:"What is the output of 2==2.0?",o:["False","True","Error","None"],a:1},
{q:"Which collection contains unique values only?",o:["List","Tuple","Dictionary","Set"],a:3},
{q:"Which keyword creates a class?",o:["struct","object","class","new"],a:2},
{q:"What is __init__()?",o:["Destructor","Constructor","Module","Decorator"],a:1},
{q:"Which keyword refers to current object?",o:["this","current","self","obj"],a:2},
{q:"Which loop executes while condition is true?",o:["for","while","repeat","loop"],a:1},
{q:"What is slicing syntax?",o:["[]","()","[:]","{}"],a:2},
{q:"Which module provides mathematical functions?",o:["random","math","os","sys"],a:1},
{q:"Which function returns object type?",o:["type()","class()","typeof()","id()"],a:0},
{q:"What is output of list(range(3))?",o:["[1,2,3]","[0,1,2]","[0,1,2,3]","[1,2]"],a:1},
{q:"Which keyword is used to import modules?",o:["include","using","import","require"],a:2},
{q:"Which statement exits a loop completely?",o:["continue","skip","break","pass"],a:2},
{q:"Which statement skips current iteration?",o:["continue","break","pass","return"],a:0},
{q:"Which statement does nothing?",o:["skip","continue","pass","empty"],a:2},
{q:"What is output of 'Python'[0]?",o:["P","y","0","Error"],a:0},
{q:"Which function returns length of object?",o:["size()","count()","length()","len()"],a:3},
{q:"Which method converts string to lowercase?",o:["lower()","small()","down()","case()"],a:0},
{q:"Which method converts string to uppercase?",o:["upper()","capital()","large()","up()"],a:0},
{q:"What is output of 5%2?",o:["2","1","2.5","0"],a:1},
{q:"Which module interacts with operating system?",o:["sys","os","math","random"],a:1},
{q:"Which function generates random number?",o:["math.rand()","random.random()","os.random()","sys.random()"],a:1},
{q:"What is inheritance?",o:["Reusing parent class properties","Deleting objects","Creating modules","Looping"],a:0},
{q:"Which OOP concept hides implementation details?",o:["Inheritance","Polymorphism","Abstraction","Looping"],a:2},
{q:"Which OOP concept allows multiple forms?",o:["Encapsulation","Inheritance","Polymorphism","Class"],a:2},
{q:"What is output of isinstance(10,int)?",o:["False","True","None","Error"],a:1}
];

const quiz=document.getElementById("quiz");
let answered = {};

questions.forEach((item,index)=>{
    let card=document.createElement("div");
    card.className="question-card";
    let html=`<div class="question">Q${index+1}. ${item.q}</div>`;
    item.o.forEach((opt,i)=>{
        html+=`<div class="option" onclick="checkAnswer(this,${i},${item.a},${index})">${String.fromCharCode(65+i)}. ${opt}</div>`;
    });
    card.innerHTML=html;
    quiz.appendChild(card);
});

function checkAnswer(el,selected,correct,index){
    const parent=el.parentElement;
    if(parent.dataset.done) return;
    parent.dataset.done=true;
    answered[index]=selected===correct;
    const options=parent.querySelectorAll(".option");
    options.forEach((op,i)=>{
        if(i===correct) op.classList.add("correct");
    });
    if(selected!==correct) el.classList.add("wrong");
    updateScore();
}

function updateScore(){
    let score=Object.values(answered).filter(v=>v).length;
    document.getElementById("score").innerText=score;
}

function submitTest(){
    let score=Object.values(answered).filter(v=>v).length;
    alert(`Test Submitted!\nYour Score: ${score}/40`);
}
</script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="auth-gate.js"></script>
</body>
</html>
